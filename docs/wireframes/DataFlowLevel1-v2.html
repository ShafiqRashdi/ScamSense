<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ScamSense DFD Level 1</title>
<style>
  body { margin: 0; background: #ffffff; }
  .ent   { fill: #ffffff; stroke: #555555; stroke-width: 1.4; }
  .proc  { fill: #ffffff; stroke: #444444; stroke-width: 1.6; }
  .store { stroke: #555555; stroke-width: 1.4; fill: none; }
  .flow  { stroke: #777777; stroke-width: 1.3; fill: none; }
  .t  { font-family: "Segoe UI", system-ui, Helvetica, sans-serif; font-size: 14px; fill: #222222; }
  .tb { font-family: "Segoe UI", system-ui, Helvetica, sans-serif; font-size: 14px; fill: #222222; font-weight: 600; }
  .s  { font-family: "Segoe UI", system-ui, Helvetica, sans-serif; font-size: 12px; fill: #777777; }
  .l  { font-family: "Segoe UI", system-ui, Helvetica, sans-serif; font-size: 12.5px; fill: #666666; }
  .n  { font-family: Consolas, ui-monospace, monospace; font-size: 12px; fill: #999999; }
  .sn { font-family: Consolas, ui-monospace, monospace; font-size: 13px; fill: #555555; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" width="1120" height="900">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777777"/>
    </marker>
  </defs>

  <!-- ===== External entities ===== -->
  <rect class="ent" x="30" y="52" width="170" height="64"/>
  <text class="tb" x="115" y="80" text-anchor="middle">Public user</text>
  <text class="s"  x="115" y="99" text-anchor="middle">no account required</text>

  <rect class="ent" x="30" y="774" width="170" height="64"/>
  <text class="tb" x="115" y="802" text-anchor="middle">Administrator</text>
  <text class="s"  x="115" y="821" text-anchor="middle">authenticated</text>

  <rect class="ent" x="880" y="452" width="210" height="64"/>
  <text class="tb" x="985" y="480" text-anchor="middle">Threat intelligence</text>
  <text class="s"  x="985" y="499" text-anchor="middle">Safe Browsing, VirusTotal</text>

  <!-- ===== Processes ===== -->
  <circle class="proc" cx="440" cy="84" r="56"/>
  <text class="n" x="440" y="70" text-anchor="middle">1.0</text>
  <text class="t" x="440" y="90" text-anchor="middle">Redact</text>
  <text class="t" x="440" y="107" text-anchor="middle">personal data</text>

  <circle class="proc" cx="440" cy="230" r="56"/>
  <text class="n" x="440" y="216" text-anchor="middle">2.0</text>
  <text class="t" x="440" y="236" text-anchor="middle">Store</text>
  <text class="t" x="440" y="253" text-anchor="middle">submission</text>

  <circle class="proc" cx="440" cy="376" r="56"/>
  <text class="n" x="440" y="362" text-anchor="middle">3.0</text>
  <text class="t" x="440" y="382" text-anchor="middle">Classify</text>
  <text class="t" x="440" y="399" text-anchor="middle">content</text>

  <circle class="proc" cx="690" cy="376" r="56"/>
  <text class="n" x="690" y="362" text-anchor="middle">4.0</text>
  <text class="t" x="690" y="382" text-anchor="middle">Check threat</text>
  <text class="t" x="690" y="399" text-anchor="middle">intelligence</text>

  <circle class="proc" cx="440" cy="522" r="56"/>
  <text class="n" x="440" y="508" text-anchor="middle">5.0</text>
  <text class="t" x="440" y="528" text-anchor="middle">Combine</text>
  <text class="t" x="440" y="545" text-anchor="middle">into verdict</text>

  <circle class="proc" cx="440" cy="668" r="56"/>
  <text class="n" x="440" y="654" text-anchor="middle">6.0</text>
  <text class="t" x="440" y="674" text-anchor="middle">Record</text>
  <text class="t" x="440" y="691" text-anchor="middle">feedback</text>

  <circle class="proc" cx="440" cy="806" r="56"/>
  <text class="n" x="440" y="792" text-anchor="middle">7.0</text>
  <text class="t" x="440" y="812" text-anchor="middle">Moderate</text>
  <text class="t" x="440" y="829" text-anchor="middle">feedback</text>

  <!-- ===== Data stores (open-ended, Yourdon & DeMarco) ===== -->
  <path class="store" d="M 640 210 H 880 M 640 250 H 880 M 680 210 V 250"/>
  <text class="sn" x="660" y="235" text-anchor="middle">D1</text>
  <text class="t"  x="692" y="235">submissions</text>

  <path class="store" d="M 820 300 H 1090 M 820 340 H 1090 M 860 300 V 340"/>
  <text class="sn" x="840" y="325" text-anchor="middle">D3</text>
  <text class="t"  x="872" y="325">threat_intel_cache</text>

  <path class="store" d="M 640 580 H 880 M 640 620 H 880 M 680 580 V 620"/>
  <text class="sn" x="660" y="605" text-anchor="middle">D2</text>
  <text class="t"  x="692" y="605">verdicts, indicators</text>

  <path class="store" d="M 640 648 H 880 M 640 688 H 880 M 680 648 V 688"/>
  <text class="sn" x="660" y="673" text-anchor="middle">D4</text>
  <text class="t"  x="692" y="673">feedback</text>

  <path class="store" d="M 640 786 H 880 M 640 826 H 880 M 680 786 V 826"/>
  <text class="sn" x="660" y="811" text-anchor="middle">D5</text>
  <text class="t"  x="692" y="811">training_samples</text>

  <!-- ===== Flows ===== -->
  <path class="flow" d="M 200 76 L 382 76" marker-end="url(#a)"/>
  <text class="l" x="291" y="68" text-anchor="middle">message or URL</text>

  <path class="flow" d="M 440 140 L 440 172" marker-end="url(#a)"/>
  <text class="l" x="450" y="161">redacted content</text>

  <path class="flow" d="M 496 230 L 636 230" marker-end="url(#a)"/>
  <text class="l" x="566" y="222" text-anchor="middle">submission record</text>

  <path class="flow" d="M 440 286 L 440 318" marker-end="url(#a)"/>
  <text class="l" x="450" y="307">redacted content</text>

  <path class="flow" d="M 480 270 L 648 336" marker-end="url(#a)"/>
  <text class="l" x="588" y="292" text-anchor="middle">URL only</text>

  <path class="flow" d="M 740 350 L 816 326" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="745" y="312" text-anchor="middle">cached result</text>

  <path class="flow" d="M 738 404 L 878 466" marker-end="url(#a)"/>
  <text class="l" x="838" y="418" text-anchor="middle">query on cache miss</text>
  <path class="flow" d="M 878 504 L 734 432" marker-end="url(#a)"/>
  <text class="l" x="800" y="498" text-anchor="middle">reputation result</text>

  <path class="flow" d="M 440 432 L 440 464" marker-end="url(#a)"/>
  <text class="l" x="450" y="453">score and indicators</text>

  <path class="flow" d="M 656 420 L 488 494" marker-end="url(#a)"/>
  <text class="l" x="606" y="472" text-anchor="middle">may raise risk only</text>

  <path class="flow" d="M 490 548 L 636 594" marker-end="url(#a)"/>
  <text class="l" x="556" y="552" text-anchor="middle">verdict</text>

  <path class="flow" d="M 384 522 L 250 522 L 250 108 L 204 108" marker-end="url(#a)"/>
  <text class="l" x="258" y="300">verdict with</text>
  <text class="l" x="258" y="316">readable indicators</text>

  <path class="flow" d="M 115 116 L 115 668 L 382 668" marker-end="url(#a)"/>
  <text class="l" x="125" y="660">feedback on a verdict</text>

  <path class="flow" d="M 496 668 L 636 668" marker-end="url(#a)"/>
  <text class="l" x="566" y="660" text-anchor="middle">pending feedback</text>

  <path class="flow" d="M 700 690 L 486 774" marker-end="url(#a)"/>
  <text class="l" x="640" y="744" text-anchor="middle">pending items</text>

  <path class="flow" d="M 384 790 L 204 790" marker-end="url(#a)"/>
  <text class="l" x="294" y="782" text-anchor="middle">pending feedback</text>
  <path class="flow" d="M 200 822 L 382 822" marker-end="url(#a)"/>
  <text class="l" x="291" y="842" text-anchor="middle">decision and label</text>

  <path class="flow" d="M 496 806 L 636 806" marker-end="url(#a)"/>
  <text class="l" x="566" y="798" text-anchor="middle">on approval only</text>
</svg>
</body>
</html>
