<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #ffffff;
      font-family: system-ui, "Segoe UI", Helvetica, sans-serif;
      color: #333333; -webkit-font-smoothing: antialiased; }
    a { color: #555555; } a:hover { color: #222222; }
    .b  { background: #d6d6d6; height: 10px; }
    .bh { background: #c4c4c4; height: 15px; }
    .bs { background: #e3e3e3; height: 8px; }
    .cap { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px;
           letter-spacing: 0.08em; color: #999999; }
    .sub { font-family: ui-monospace, Consolas, monospace; font-size: 10px;
           letter-spacing: 0.06em; color: #999999; }
    .card { border: 1px solid #b5b5b5; }
  </style>
</helmet>

<div style="padding: 30px 34px 34px; display: flex; flex-direction: column; gap: 12px">

  <div style="width: 375px; border: 1px solid #8a8a8a; background: #ffffff">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-bottom: 1px solid #b5b5b5">
      <div class="b" style="width: 84px"></div>
      <div class="sub">EN / BM</div>
    </div>

    <div style="padding: 14px 13px; display: flex; flex-direction: column; gap: 12px">

      <!-- verified panel, first -->
      <div style="border: 2px solid #555555; padding: 12px; display: flex; flex-direction: column; gap: 10px">

        <div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; border: 1px solid #555555; background: #555555; color: #ffffff; padding: 5px 9px">
          <div style="width: 11px; height: 11px; border: 1.5px solid #ffffff; border-radius: 50%"></div>
          <div style="font-size: 11px">Verified address</div>
        </div>

        <div class="bh" style="width: 84%"></div>

        <div style="display: flex; flex-direction: column; gap: 5px">
          <div class="b" style="width: 100%"></div>
          <div class="b" style="width: 100%"></div>
          <div class="b" style="width: 46%"></div>
        </div>

        <!-- scope box: always visible -->
        <div style="background: #f7f7f7; border: 1px solid #cccccc; padding: 10px; display: flex; flex-direction: column; gap: 6px">
          <div class="b" style="width: 64%"></div>
          <div class="bs" style="width: 100%"></div>
          <div class="bs" style="width: 100%"></div>
          <div class="bs" style="width: 100%"></div>
          <div class="bs" style="width: 38%"></div>
        </div>

        <!-- collapsed disclosure -->
        <div style="display: flex; align-items: center; gap: 8px; border-top: 1px solid #cccccc; padding-top: 9px">
          <div style="width: 0; height: 0; border-left: 6px solid #777777; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent"></div>
          <div style="font-size: 11px; color: #555555">How to check this yourself</div>
          <div class="sub" style="margin-left: auto">COLLAPSED</div>
        </div>
      </div>

      <!-- general verdict, second -->
      <div style="border: 2px solid #555555; padding: 12px; display: flex; flex-direction: column; gap: 9px">
        <div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; border: 1px solid #555555; background: #555555; color: #ffffff; padding: 5px 9px">
          <div style="width: 11px; height: 11px; border: 1.5px solid #ffffff; border-radius: 50%"></div>
          <div style="font-size: 11px">No warning signs</div>
        </div>
        <div class="b" style="width: 70%; height: 12px"></div>
        <div style="display: flex; flex-direction: column; gap: 5px">
          <div class="bs" style="width: 100%"></div>
          <div class="bs" style="width: 52%"></div>
        </div>
        <div style="background: #f7f7f7; border: 1px solid #cccccc; padding: 9px; display: flex; flex-direction: column; gap: 5px">
          <div class="b" style="width: 48%"></div>
          <div class="bs" style="width: 100%"></div>
          <div class="bs" style="width: 60%"></div>
        </div>
      </div>

      <!-- what you checked -->
      <div class="card" style="padding: 11px; display: flex; flex-direction: column; gap: 7px">
        <div class="b" style="width: 42%"></div>
        <div style="background: #f7f7f7; border: 1px solid #cccccc; padding: 8px; display: flex; flex-direction: column; gap: 4px">
          <div style="background: #dddddd; height: 8px; width: 100%"></div>
          <div style="background: #dddddd; height: 8px; width: 62%"></div>
        </div>
        <div class="bs" style="width: 78%"></div>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":450,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
