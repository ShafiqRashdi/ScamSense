<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #ffffff;
      font-family: system-ui, "Segoe UI", Helvetica, sans-serif;
      color: #333333; -webkit-font-smoothing: antialiased; }
    a { color: #555555; } a:hover { color: #222222; }
    .b  { background: #d6d6d6; height: 10px; }
    .bh { background: #c4c4c4; height: 15px; }
    .bs { background: #e3e3e3; height: 8px; }
    .cap { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px;
           letter-spacing: 0.08em; color: #999999; }
    .sub { font-family: ui-monospace, Consolas, monospace; font-size: 10px;
           letter-spacing: 0.06em; color: #999999; }
    .card { border: 1px solid #b5b5b5; }
    .btn { font-size: 11px; text-align: center; border: 1px solid #999999;
           background: #f2f2f2; padding: 7px 12px; color: #555555; }
  </style>
</helmet>

<div style="padding: 30px 34px 34px; display: flex; flex-direction: column; gap: 12px">

  <div style="width: 760px; border: 1px solid #8a8a8a; background: #ffffff">

    <!-- top bar -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid #b5b5b5">
      <div style="display: flex; gap: 16px; align-items: center">
        <div class="b" style="width: 84px"></div>
        <div style="font-size: 11px; color: #777777">Dashboard</div>
        <div style="font-size: 11px; color: #222222; border-bottom: 2px solid #555555; padding-bottom: 2px">Moderation</div>
      </div>
      <div style="font-size: 11px; color: #777777">Log out</div>
    </div>

    <div style="padding: 14px; display: flex; flex-direction: column; gap: 13px">

      <div class="bh" style="width: 200px"></div>

      <!-- counters -->
      <div style="display: flex; gap: 10px">
        <sc-for list="{{counters}}" as="c" hint-placeholder-count="4">
          <div class="card" style="flex: 1; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 4px">
            <div style="font-size: 20px; font-weight: 600; color: #222222">{{c.value}}</div>
            <div class="sub">{{c.label}}</div>
          </div>
        </sc-for>
      </div>

      <!-- reviewing standard -->
      <div class="card" style="background: #f7f7f7; padding: 11px; display: flex; flex-direction: column; gap: 6px">
        <div class="b" style="width: 42%"></div>
        <div class="bs" style="width: 100%"></div>
        <div class="bs" style="width: 74%"></div>
      </div>

      <!-- queue items -->
      <sc-for list="{{items}}" as="it" hint-placeholder-count="2">
        <div class="card" style="padding: 12px; display: flex; flex-direction: column; gap: 10px">

          <div style="display: flex; align-items: center; justify-content: space-between">
            <div style="font-size: 10.5px; border: 1px solid #999999; background: #f2f2f2; padding: 4px 8px; color: #555555">{{it.stance}}</div>
            <div class="bs" style="width: 96px"></div>
          </div>

          <div style="display: flex; gap: 18px">
            <div style="width: 180px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px">
              <div class="sub">OUR VERDICT</div>
              <div class="b" style="width: 76%"></div>
              <div class="bs" style="width: 60%"></div>
              <div class="bs" style="width: 88%"></div>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
              <div class="sub">SUBMITTED</div>
              <div style="background: #f7f7f7; border: 1px solid #cccccc; padding: 8px; display: flex; flex-direction: column; gap: 4px">
                <div style="background: #dddddd; height: 8px; width: 100%"></div>
                <div style="background: #dddddd; height: 8px; width: 58%"></div>
              </div>
              <sc-if value="{{it.hasComment}}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 3px">
                  <div class="sub">THEIR COMMENT</div>
                  <div class="bs" style="width: 100%"></div>
                  <div class="bs" style="width: 46%"></div>
                </div>
              </sc-if>
            </div>
          </div>

          <!-- controls -->
          <div style="display: flex; gap: 9px; align-items: flex-end; border-top: 1px solid #cccccc; padding-top: 10px">
            <div style="display: flex; flex-direction: column; gap: 5px">
              <div class="b" style="width: 70px"></div>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px; border: 1px solid #999999; background: #ffffff; padding: 6px 9px; min-width: 118px">
                <div style="font-size: 11px; color: #999999">Choose&#8230;</div>
                <div style="width: 0; height: 0; border-top: 5px solid #777777; border-left: 4px solid transparent; border-right: 4px solid transparent"></div>
              </div>
            </div>
            <div style="font-size: 11px; text-align: center; border: 1px solid #555555; background: #555555; color: #ffffff; padding: 7px 14px">Approve</div>
            <div class="btn">Reject</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":840,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      counters: [
        { value: '7', label: 'PENDING' },
        { value: '24', label: 'APPROVED' },
        { value: '24', label: 'IN RETRAINING SET' },
        { value: '11', label: 'NOT EXPORTED' },
      ],
      items: [
        { stance: 'Reporter disputes the verdict', hasComment: true },
        { stance: 'Reporter agrees with the verdict', hasComment: false },
      ],
    };
  }
}
</script>
</body>
</html>
