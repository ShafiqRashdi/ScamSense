<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #ffffff;
      font-family: system-ui, "Segoe UI", Helvetica, sans-serif;
      color: #333333; -webkit-font-smoothing: antialiased; }
    a { color: #555555; } a:hover { color: #222222; }
    .b  { background: #d6d6d6; height: 10px; }
    .bh { background: #c4c4c4; height: 15px; }
    .bs { background: #e3e3e3; height: 8px; }
    .cap { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px;
           letter-spacing: 0.08em; color: #999999; }
    .sub { font-family: ui-monospace, Consolas, monospace; font-size: 10px;
           letter-spacing: 0.06em; color: #999999; }
    .card { border: 1px solid #b5b5b5; }
  </style>
</helmet>

<div style="padding: 30px 34px 34px; display: flex; flex-direction: column; gap: 12px">

  <div style="display: flex; gap: 22px; align-items: flex-start">
    <sc-for list="{{bands}}" as="v" hint-placeholder-count="3">
      <div style="width: 375px; flex-shrink: 0; display: flex; flex-direction: column; gap: 7px">

        <div class="sub">{{v.tag}}</div>

        <div style="border: 1px solid #8a8a8a; background: #ffffff">

          <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-bottom: 1px solid #b5b5b5">
            <div class="b" style="width: 84px"></div>
            <div class="sub">EN / BM</div>
          </div>

          <div style="padding: 14px 13px; display: flex; flex-direction: column; gap: 12px">

            <!-- verdict card -->
            <div style="border: 2px solid #555555; padding: 12px; display: flex; flex-direction: column; gap: 10px">

              <div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; border: 1px solid #555555; background: #555555; color: #ffffff; padding: 5px 9px">
                <div style="width: 11px; height: 11px; border: 1.5px solid #ffffff; border-radius: {{v.iconRadius}}"></div>
                <div style="font-size: 11px">{{v.label}}</div>
              </div>

              <div class="bh" style="width: 78%"></div>

              <div style="display: flex; flex-direction: column; gap: 5px">
                <div class="b" style="width: 100%"></div>
                <div class="b" style="width: 100%"></div>
                <div class="b" style="width: 58%"></div>
              </div>

              <div style="background: #f7f7f7; border: 1px solid #cccccc; padding: 10px; display: flex; flex-direction: column; gap: 6px">
                <div class="b" style="width: 52%"></div>
                <div class="bs" style="width: 100%"></div>
                <div class="bs" style="width: 100%"></div>
                <div class="bs" style="width: 44%"></div>
              </div>

              <sc-if value="{{v.hasClosing}}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; flex-direction: column; gap: 5px">
                  <div class="b" style="width: 100%"></div>
                  <div class="b" style="width: 40%"></div>
                </div>
              </sc-if>
            </div>

            <!-- indicators -->
            <div class="card" style="padding: 11px; display: flex; flex-direction: column; gap: 9px">
              <div class="b" style="width: 46%"></div>

              <sc-if value="{{v.hasIndicators}}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; flex-direction: column; gap: 9px">
                  <div style="display: flex; gap: 7px; align-items: flex-start">
                    <div style="font-size: 10px; color: #999999; line-height: 1">&bull;</div>
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 5px">
                      <div class="bs" style="width: 100%"></div>
                      <div class="bs" style="width: 62%"></div>
                      <div style="background: #ececec; height: 8px; width: 76%"></div>
                    </div>
                  </div>
                  <div style="display: flex; gap: 7px; align-items: flex-start">
                    <div style="font-size: 10px; color: #999999; line-height: 1">&bull;</div>
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 5px">
                      <div class="bs" style="width: 88%"></div>
                      <div style="background: #ececec; height: 8px; width: 48%"></div>
                    </div>
                  </div>
                </div>
              </sc-if>

              <sc-if value="{{v.hasEmpty}}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; flex-direction: column; gap: 5px">
                  <div class="bs" style="width: 100%"></div>
                  <div class="bs" style="width: 100%"></div>
                  <div class="bs" style="width: 36%"></div>
                </div>
              </sc-if>
            </div>

            <!-- what you checked -->
            <div class="card" style="padding: 11px; display: flex; flex-direction: column; gap: 7px">
              <div class="b" style="width: 42%"></div>
              <div style="background: #f7f7f7; border: 1px solid #cccccc; padding: 8px; display: flex; flex-direction: column; gap: 4px">
                <div style="background: #dddddd; height: 8px; width: 100%"></div>
                <div style="background: #dddddd; height: 8px; width: 54%"></div>
              </div>
              <div class="bs" style="width: 72%"></div>
            </div>

            <!-- feedback -->
            <div class="card" style="padding: 11px; display: flex; flex-direction: column; gap: 9px">
              <div class="b" style="width: 44%"></div>
              <div style="display: flex; gap: 7px">
                <div style="flex: 1; font-size: 10.5px; text-align: center; padding: 8px 0; border: 1px solid #999999; background: #f2f2f2; color: #555555">This looks right</div>
                <div style="flex: 1; font-size: 10.5px; text-align: center; padding: 8px 0; border: 1px solid #999999; background: #f2f2f2; color: #555555">I think this is wrong</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1240,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      bands: [
        {
          tag: 'HIGH  ·  p > 0.60', label: 'Likely a scam', iconRadius: '0',
          hasClosing: false, hasIndicators: true, hasEmpty: false,
        },
        {
          tag: 'MEDIUM  ·  0.20 – 0.60', label: 'Not certain', iconRadius: '50%',
          hasClosing: true, hasIndicators: false, hasEmpty: true,
        },
        {
          tag: 'LOW  ·  p < 0.20', label: 'No warning signs', iconRadius: '50%',
          hasClosing: false, hasIndicators: false, hasEmpty: true,
        },
      ],
    };
  }
}
</script>
</body>
</html>
